services:
  postgres:
    image: postgres:16-alpine
    container_name: ioms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Baymax@8600
      POSTGRES_DB: inventory_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: demonsatyam/ioms-backend:latest
    container_name: ioms_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:Baymax%408600@postgres:5432/inventory_db
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      args:
        # Browser calls the backend directly; for local Docker this is the
        # host-published backend port.
        VITE_API_URL: http://localhost:8000
    container_name: ioms_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
